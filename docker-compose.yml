# One command: docker compose up --build
# Everything is behind nginx on http://localhost:8080 (API reference at /scalar), which balances two API containers.
name: realtime-chat

x-api-environment: &api-environment
  ASPNETCORE_ENVIRONMENT: Production
  ConnectionStrings__Chat: "Host=db;Database=chat;Username=chat;Password=${POSTGRES_PASSWORD:-chat-local}"
  ConnectionStrings__Redis: "redis:6379"
  Database__MigrateOnStartup: "true"
  Jwt__SigningKey: ${JWT_SIGNING_KEY:-local-signing-key-change-me-in-the-env-file-0123456789}
  # Set these to email offline people through the notification-service.
  UnreadEmails__BaseUrl: ${NOTIFICATION_SERVICE_URL:-}
  UnreadEmails__ApiKey: ${NOTIFICATION_SERVICE_KEY:-}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: chat
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chat-local}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Two instances: people connected to different ones still talk, through the Redis backplane.
  api:
    build: .
    restart: on-failure
    deploy:
      replicas: 2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: *api-environment
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q Healthy <&3"]
      interval: 5s
      timeout: 5s
      retries: 30

  proxy:
    image: nginx:1.29-alpine
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:8080"

volumes:
  db-data:
