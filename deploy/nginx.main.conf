# Every chat user holds a WebSocket open, and nginx uses two connections for each (client and API side).
# The defaults (1024 per worker) run out at a few thousand people, so the limits are raised here.
worker_processes auto;
worker_rlimit_nofile 65536;

events {
    worker_connections 16384;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    access_log off;
    include /etc/nginx/conf.d/*.conf;
}
